[metadata]
name = cardio-xchek
version = 0.0.1
author = Jonathan Edmonson
author_email = me@jedmonson.net
description = A python playing cards & Baccarat implementation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/xchek/cardio
project_urls =
    Bug Tracker = https://github.com/xchek/cardio/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src